[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chicken-disease-data-synthesis"
version = "2.0.0"
description = "Enterprise-style chicken disease synthetic dataset generation and evaluation pipeline."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0.0",
  "pandas>=1.5.0",
  "deepeval>=2.0.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
chicken-data = "chicken_data_synthesis.cli:main"
chicken-wiki = "chicken_data_synthesis.wiki_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
